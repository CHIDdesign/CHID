<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CHID</title>
    <meta name="description" content="CHID Industrial Design Portfolio. Seoul based Product Designer. 서울 기반 산업 디자이너 CHID의 포트폴리오.">
    <meta name="keywords" content="CHID, Industrial Design, Product Design, Portfolio, Designer, 칫, 산업디자인, 제품디자인">
    <meta name="author" content="CHID">
    <meta name="robots" content="index, follow">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://chid.kr">
    <meta property="og:title" content="CHID">
    <meta property="og:description" content="Industrial Design Portfolio">
    <meta property="og:image" content="https://chid.kr/img/main/meta_img.webp">
    <link rel="preload" as="image" href="img/main/loop/poster1.jpg">
    <link rel="icon" href="img/main/favicon.webp" type="image/webp">
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.8/dist/web/static/pretendard.css" />
    <script type="application/ld+json">
    {
      "@context": "http://schema.org",
      "@type": "Person",
      "name": "CHID",
      "url": "https://chid.kr",
      "jobTitle": "Industrial Designer",
      "sameAs": [
        "https://www.instagram.com/chid_design/",
        "https://www.behance.net/chiddesign/"
      ]
    }
    </script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Pretendard', 'Inter', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
            background-color: #ffffff;
            color: #111111;
            height: 100vh;
            height: 100dvh; 
            display: flex;
            flex-direction: column;
            overflow: hidden;
            opacity: 0; 
            transition: opacity 0.5s ease-in-out; 
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            -webkit-tap-highlight-color: transparent;
        }
        body.fade-in { opacity: 1; }
        #video-container {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1; background-color: #000000; overflow: hidden;
        }
        #video-container::after {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 5;
            pointer-events: none;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.7' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='1'/%3E%3C/svg%3E");
            opacity: 0.04; 
        }
        #poster-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-image: url('img/main/loop/poster1.jpg'); 
            background-size: cover;
            background-position: center;
            z-index: 10;
            transition: opacity 0.8s ease-out;
            opacity: 1;
        }
        #poster-layer.hidden { opacity: 0; pointer-events: none; }
        .bg-video {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            object-fit: cover; 
            opacity: 0;
            z-index: 0;
            transform: translate3d(0,0,0);
            will-change: opacity;
            transition: opacity 0.8s cubic-bezier(0.16, 1, 0.3, 1); 
        }
        .bg-video.active { opacity: 1; z-index: 1; }
        header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 20px 40px; 
            width: 100%;
            position: fixed; top: 0; left: 0; z-index: 100;
            background-color: rgba(255, 255, 255, 0.01); 
            backdrop-filter: blur(0px); 
            transition: all 0.5s ease;
            color: #111111;
            height: 90px;
        }
        header.white-skin { color: #ffffff !important; }
        header.white-skin .logo-img { filter: invert(1); }
        .logo-container { cursor: pointer; z-index: 101; pointer-events: auto; }
        .logo-img { 
            height: 60px; 
            width: auto; display: block; 
            transition: height 0.3s ease, filter 0.5s ease; 
        }
        nav ul { display: flex; list-style: none; gap: 50px; }
        nav ul li { margin-left: 0; }
        nav ul li a {
            text-decoration: none; color: inherit; 
            font-size: clamp(15px, 1.2vw, 18px); 
            font-weight: 400; 
            display: block; 
            padding: 10px 0; 
            letter-spacing: -0.02em;
            opacity: 0.8; 
            transition: opacity 0.3s ease, transform 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            position: relative;
            text-align: center;
            pointer-events: auto;
        }
        nav ul li a::before {
            display: block; content: attr(title); font-weight: 700; height: 0; overflow: hidden; visibility: hidden;
        }
        header.white-skin nav ul li a { text-shadow: 0 0 20px rgba(0,0,0,0.8); }
        nav ul li:hover a { transform: translateY(-0.33em); opacity: 1; }
        nav ul li.active a { font-weight: 700; opacity: 1; }
        nav ul li.active a::after {
            content: ''; display: block; width: 100%; height: 2px; 
            background: currentColor;
            margin-top: 5px; 
            border-radius: 2px;
        }
        main { flex: 1; width: 100%; height: 100%; }
        @media (pointer: fine) {
          * { cursor: none !important; }
        }
        #canvas {
          position: fixed;
          top: 0;
          left: 0;
          width: 100vw;
          height: 100vh;
          z-index: 9999;
          pointer-events: none;
          mix-blend-mode: multiply;
          background: transparent;
        }
        @media (max-width: 768px) {
            header { 
                padding: 15px 20px; 
                flex-direction: column; 
                gap: 15px;
                height: auto;
                background: linear-gradient(to bottom, rgba(0,0,0,0.1) 0%, transparent 100%);
            }
            .logo-img { height: 50px; }
            nav { width: 100%; }
            nav ul { justify-content: center; gap: 25px; width: 100%; }
            nav ul li a { font-size: 16px; font-weight: 500; }
        }
    </style>
</head>
<body>
    <div id="video-container">
        <div id="poster-layer"></div>
        <video class="bg-video" id="playerA" playsinline webkit-playsinline muted preload="auto"></video>
        <video class="bg-video" id="playerB" playsinline webkit-playsinline muted preload="auto"></video>
    </div>
    <header id="main-header">
        <div class="logo-container" id="main-logo">
            <img src="img/main/Head Logo.svg" alt="Logo" class="logo-img">
        </div>
        <nav>
            <ul>
                <li><a href="about.html" class="nav-link" title="About">About</a></li>
                <li><a href="projects.html" class="nav-link" title="Projects">Projects</a></li>
                <li><a href="contact.html" class="nav-link" title="Contact">Contact</a></li>
            </ul>
        </nav>
    </header>
    <main></main>
    <canvas id="canvas"></canvas>

    <script src="static/js/page_effect.js"></script>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const header = document.getElementById("main-header");
            const posterLayer = document.getElementById("poster-layer");
            
            function fadeAndMove(destinationUrl) {
                if(window.location.href.includes(destinationUrl) && !destinationUrl.includes('index.html')) return;
                document.body.classList.remove('fade-in'); 
                setTimeout(() => { window.location.href = destinationUrl; }, 500);
            }

            const navLinks = document.querySelectorAll('.nav-link');
            navLinks.forEach(link => link.addEventListener('click', function(e) {
                e.preventDefault(); fadeAndMove(this.getAttribute('href')); 
            }));

            const mainLogo = document.getElementById('main-logo');
            if(mainLogo) mainLogo.addEventListener('click', function() { fadeAndMove('index.html'); });

            // ----------------------------------------------------
            // Ping-Pong Video Player Engine (Enterprise-grade)
            // 브라우저 디코더 한계(특히 iOS) 및 캐시 문제를 완벽 해결
            // ----------------------------------------------------
            const players = [
                document.getElementById('playerA'),
                document.getElementById('playerB')
            ];
            
            const playlistData = [
                { src: "img/main/loop/video 1.mp4", theme: "light" },
                { src: "img/main/loop/video 2.mp4", theme: "dark" },
                { src: "img/main/loop/video 3.mp4", theme: "light" },
                { src: "img/main/loop/video 4.mp4", theme: "light" },
                { src: "img/main/loop/video 5.mp4", theme: "light" },
                { src: "img/main/loop/video 6.mp4", theme: "light" }
            ];
            
            let videoQueue = [];
            let activePlayerIndex = 0; // 0 (playerA) 또는 1 (playerB)
            let isTransitioning = false;

            function shuffleArray(array) {
                for (let i = array.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [array[i], array[j]] = [array[j], array[i]];
                }
            }

            function ensureQueue() {
                if (videoQueue.length < 2) {
                    let newPlaylist = playlistData.map((_, i) => i);
                    shuffleArray(newPlaylist);
                    if (videoQueue.length > 0 && videoQueue[videoQueue.length - 1] === newPlaylist[0]) {
                        if (newPlaylist.length > 1) {
                            [newPlaylist[0], newPlaylist[1]] = [newPlaylist[1], newPlaylist[0]];
                        }
                    }
                    videoQueue = videoQueue.concat(newPlaylist);
                }
            }

            function updateHeaderColor(videoElement) {
                const theme = videoElement.getAttribute("data-theme");
                const dynamicCanvas = document.getElementById('canvas'); 
                
                if (theme === "dark") {
                    header.classList.add("white-skin");
                    window.cursorColorMode = 'white'; 
                    if(dynamicCanvas) dynamicCanvas.style.mixBlendMode = 'plus-lighter';
                } else {
                    header.classList.remove("white-skin");
                    window.cursorColorMode = 'black'; 
                    if(dynamicCanvas) dynamicCanvas.style.mixBlendMode = 'multiply';
                }
            }

            players.forEach((player, idx) => {
                player.muted = true;
                player.defaultMuted = true;
                
                player.addEventListener('timeupdate', () => {
                    if (idx === activePlayerIndex && !isTransitioning) {
                        const timeRemaining = player.duration - player.currentTime;
                        if (timeRemaining <= 0.82 && timeRemaining > 0 && player.duration > 1) {
                            isTransitioning = true;
                            playNextVideo();
                        }
                    }
                });

                player.addEventListener('ended', () => {
                    if (idx === activePlayerIndex && !isTransitioning) {
                        isTransitioning = true;
                        playNextVideo();
                    }
                });
            });

            function preloadNextVideo() {
                ensureQueue();
                const nextDataIndex = videoQueue[0];
                const nextPlayerIndex = 1 - activePlayerIndex; // 대기 중인 플레이어
                const standbyPlayer = players[nextPlayerIndex];
                const nextData = playlistData[nextDataIndex];
                
                // 브라우저의 네이티브 HTTP 캐시를 활용하여 데이터 낭비 없이 로드
                standbyPlayer.src = nextData.src;
                standbyPlayer.setAttribute('data-theme', nextData.theme);
                standbyPlayer.load();
            }

            function playNextVideo() {
                ensureQueue();
                const nextDataIndex = videoQueue.shift();
                
                const currentPlayer = players[activePlayerIndex];
                const nextPlayerIndex = 1 - activePlayerIndex;
                const nextPlayer = players[nextPlayerIndex];
                
                // iOS 등에서 투명도 0인 비디오의 자동재생을 차단하는 것을 막기 위해 사전에 클래스 추가
                nextPlayer.classList.add('active');
                updateHeaderColor(nextPlayer);
                
                var playPromise = nextPlayer.play();
                if (playPromise !== undefined) {
                    playPromise.then(() => {
                        // 정상적으로 재생이 시작되면 상태 업데이트
                        activePlayerIndex = nextPlayerIndex;
                        
                        setTimeout(() => {
                            if (currentPlayer) {
                                currentPlayer.classList.remove('active');
                                currentPlayer.pause();
                            }
                            isTransitioning = false;
                            
                            // 전환이 완전히 끝난 후 다음 영상을 대기 플레이어에 프리로드
                            preloadNextVideo();
                        }, 800); 
                    }).catch(error => {
                        console.error("Next video play failed:", error);
                        // 에러 시 시각적 상태 롤백
                        nextPlayer.classList.remove('active');
                        updateHeaderColor(currentPlayer);
                        isTransitioning = false;
                        
                        // 복구 시도
                        setTimeout(playNextVideo, 500); 
                    });
                } else {
                    activePlayerIndex = nextPlayerIndex;
                    setTimeout(() => {
                        currentPlayer.classList.remove('active');
                        currentPlayer.pause();
                        isTransitioning = false;
                        preloadNextVideo();
                    }, 800);
                }
            }

            // --- 초기화 로직 ---
            ensureQueue();
            const firstDataIndex = videoQueue.shift();
            const firstData = playlistData[firstDataIndex];
            
            const firstPlayer = players[activePlayerIndex];
            firstPlayer.src = firstData.src;
            firstPlayer.setAttribute('data-theme', firstData.theme);
            firstPlayer.classList.add('active');
            updateHeaderColor(firstPlayer);
            
            if (posterLayer) posterLayer.style.display = 'none'; 
            
            firstPlayer.setAttribute('autoplay', 'true'); 
            firstPlayer.load();
            
            preloadNextVideo(); // 대기 플레이어에 두 번째 영상 프리로드

            function tryPlayFirstVideo() {
                firstPlayer.muted = true;
                var playPromise = firstPlayer.play();
                if (playPromise !== undefined) {
                    playPromise.catch((error) => {
                        console.warn("Auto-play prevented, waiting for interaction.");
                        const interactionHandler = () => {
                            firstPlayer.play(); 
                            document.removeEventListener('click', interactionHandler);
                            document.removeEventListener('touchstart', interactionHandler);
                        };
                        document.addEventListener('click', interactionHandler);
                        document.addEventListener('touchstart', interactionHandler);
                    });
                }
            }

            if (firstPlayer.readyState >= 3) {
                tryPlayFirstVideo();
            } else {
                firstPlayer.addEventListener('canplay', tryPlayFirstVideo, { once: true });
                setTimeout(() => { if (firstPlayer.paused) tryPlayFirstVideo(); }, 2000);
            }
        });
    </script>
</body>
</html>
