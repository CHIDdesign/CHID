<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CHID</title>
    <meta name="description" content="CHID Industrial Design Portfolio. Seoul based Product Designer. 서울 기반 산업 디자이너 CHID의 포트폴리오.">
    <meta name="keywords" content="CHID, Industrial Design, Product Design, Portfolio, Designer, 칫, 산업디자인, 제품디자인">
    <meta name="author" content="CHID">
    <meta name="robots" content="index, follow">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://chid.kr">
    <meta property="og:title" content="CHID">
    <meta property="og:description" content="Industrial Design Portfolio">
    <meta property="og:image" content="https://chid.kr/img/main/meta_img.webp">
    <link rel="preload" as="image" href="img/main/loop/poster1.jpg">
    <link rel="icon" href="img/main/favicon.webp" type="image/webp">
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.8/dist/web/static/pretendard.css" />
    <script type="application/ld+json">
    {
      "@context": "http://schema.org",
      "@type": "Person",
      "name": "CHID",
      "url": "https://chid.kr",
      "jobTitle": "Industrial Designer",
      "sameAs": [
        "https://www.instagram.com/chid_design/",
        "https://www.behance.net/chiddesign/"
      ]
    }
    </script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Pretendard', 'Inter', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
            background-color: #ffffff;
            color: #111111;
            height: 100vh;
            height: 100dvh; 
            display: flex;
            flex-direction: column;
            overflow: hidden;
            opacity: 0; 
            transition: opacity 0.5s ease-in-out; 
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            -webkit-tap-highlight-color: transparent;
        }
        body.fade-in { opacity: 1; }
        #video-container {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1; background-color: #000000; overflow: hidden;
        }
        #video-container::after {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 5;
            pointer-events: none;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.7' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='1'/%3E%3C/svg%3E");
            opacity: 0.04; 
        }
        #poster-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-image: url('img/main/loop/poster1.jpg'); 
            background-size: cover;
            background-position: center;
            z-index: 10;
            transition: opacity 0.8s ease-out;
            opacity: 1;
        }
        #poster-layer.hidden { opacity: 0; pointer-events: none; }
        .bg-video {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            object-fit: cover; 
            opacity: 0;
            z-index: 0;
            transform: translate3d(0,0,0);
            will-change: opacity;
            transition: opacity 0.8s cubic-bezier(0.16, 1, 0.3, 1); 
        }
        .bg-video.active { opacity: 1; z-index: 1; }
        header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 20px 40px; 
            width: 100%;
            position: fixed; top: 0; left: 0; z-index: 100;
            background-color: rgba(255, 255, 255, 0.01); 
            backdrop-filter: blur(0px); 
            transition: all 0.5s ease;
            color: #111111;
            height: 90px;
        }
        header.white-skin { color: #ffffff !important; }
        header.white-skin .logo-img { filter: invert(1); }
        .logo-container { cursor: pointer; z-index: 101; pointer-events: auto; }
        .logo-img { 
            height: 60px; 
            width: auto; display: block; 
            transition: height 0.3s ease, filter 0.5s ease; 
        }
        nav ul { display: flex; list-style: none; gap: 50px; }
        nav ul li { margin-left: 0; }
        nav ul li a {
            text-decoration: none; color: inherit; 
            font-size: clamp(15px, 1.2vw, 18px); 
            font-weight: 400; 
            display: block; 
            padding: 10px 0; 
            letter-spacing: -0.02em;
            opacity: 0.8; 
            transition: opacity 0.3s ease, transform 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            position: relative;
            text-align: center;
            pointer-events: auto;
        }
        nav ul li a::before {
            display: block; content: attr(title); font-weight: 700; height: 0; overflow: hidden; visibility: hidden;
        }
        header.white-skin nav ul li a { text-shadow: 0 0 20px rgba(0,0,0,0.8); }
        nav ul li:hover a { transform: translateY(-0.33em); opacity: 1; }
        nav ul li.active a { font-weight: 700; opacity: 1; }
        nav ul li.active a::after {
            content: ''; display: block; width: 100%; height: 2px; 
            background: currentColor;
            margin-top: 5px; 
            border-radius: 2px;
        }
        main { flex: 1; width: 100%; height: 100%; }
        @media (pointer: fine) {
          * { cursor: none !important; }
        }
        #canvas {
          position: fixed;
          top: 0;
          left: 0;
          width: 100vw;
          height: 100vh;
          z-index: 9999;
          pointer-events: none;
          mix-blend-mode: multiply;
          background: transparent;
        }
        @media (max-width: 768px) {
            header { 
                padding: 15px 20px; 
                flex-direction: column; 
                gap: 15px;
                height: auto;
                background: linear-gradient(to bottom, rgba(0,0,0,0.1) 0%, transparent 100%);
            }
            .logo-img { height: 50px; }
            nav { width: 100%; }
            nav ul { justify-content: center; gap: 25px; width: 100%; }
            nav ul li a { font-size: 16px; font-weight: 500; }
        }
    </style>
</head>
<body>
    <div id="video-container">
        <div id="poster-layer"></div>
        <video class="bg-video" id="v1" playsinline webkit-playsinline muted data-theme="light" preload="none">
            <source src="img/main/loop/video 1.mp4" type="video/mp4">
        </video>
        <video class="bg-video" id="v2" playsinline webkit-playsinline muted data-theme="dark" preload="none">
            <source src="img/main/loop/video 2.mp4" type="video/mp4">
        </video>
        <video class="bg-video" id="v3" playsinline webkit-playsinline muted data-theme="light" preload="none">
            <source src="img/main/loop/video 3.mp4" type="video/mp4">
        </video>
        <video class="bg-video" id="v4" playsinline webkit-playsinline muted data-theme="light" preload="none">
            <source src="img/main/loop/video 4.mp4" type="video/mp4">
        </video>
        <video class="bg-video" id="v5" playsinline webkit-playsinline muted data-theme="light" preload="none">
            <source src="img/main/loop/video 5.mp4" type="video/mp4">
        </video>
        <video class="bg-video" id="v6" playsinline webkit-playsinline muted data-theme="light" preload="none">
            <source src="img/main/loop/video 6.mp4" type="video/mp4">
        </video>
    </div>
    <header id="main-header">
        <div class="logo-container" id="main-logo">
            <img src="img/main/Head Logo.svg" alt="Logo" class="logo-img">
        </div>
        <nav>
            <ul>
                <li><a href="about.html" class="nav-link" title="About">About</a></li>
                <li><a href="projects.html" class="nav-link" title="Projects">Projects</a></li>
                <li><a href="contact.html" class="nav-link" title="Contact">Contact</a></li>
            </ul>
        </nav>
    </header>
    <main></main>
    <canvas id="canvas"></canvas>

    <script src="static/js/page_effect.js"></script>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const header = document.getElementById("main-header");
            const posterLayer = document.getElementById("poster-layer");
            
            function fadeAndMove(destinationUrl) {
                if(window.location.href.includes(destinationUrl) && !destinationUrl.includes('index.html')) return;
                document.body.classList.remove('fade-in'); 
                setTimeout(() => { window.location.href = destinationUrl; }, 500);
            }

            const navLinks = document.querySelectorAll('.nav-link');
            navLinks.forEach(link => link.addEventListener('click', function(e) {
                e.preventDefault(); fadeAndMove(this.getAttribute('href')); 
            }));

            const mainLogo = document.getElementById('main-logo');
            if(mainLogo) mainLogo.addEventListener('click', function() { fadeAndMove('index.html'); });

            // 비디오 셔플 및 무한 재생 로직
            const videos = Array.from(document.querySelectorAll('.bg-video'));
            let videoQueue = [];
            let activeVideoIndex = -1;

            function shuffleArray(array) {
                for (let i = array.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [array[i], array[j]] = [array[j], array[i]];
                }
            }

            function ensureQueue() {
                if (videoQueue.length < 2) {
                    let newPlaylist = videos.map((_, i) => i);
                    shuffleArray(newPlaylist);
                    if (videoQueue.length > 0 && videoQueue[videoQueue.length - 1] === newPlaylist[0]) {
                        if (newPlaylist.length > 1) {
                            [newPlaylist[0], newPlaylist[1]] = [newPlaylist[1], newPlaylist[0]];
                        }
                    }
                    videoQueue = videoQueue.concat(newPlaylist);
                }
            }

            function updateHeaderColor(videoElement) {
                const theme = videoElement.getAttribute("data-theme");
                const dynamicCanvas = document.getElementById('canvas'); 
                
                if (theme === "dark") {
                    header.classList.add("white-skin");
                    window.cursorColorMode = 'white'; 
                    if(dynamicCanvas) dynamicCanvas.style.mixBlendMode = 'plus-lighter';
                } else {
                    header.classList.remove("white-skin");
                    window.cursorColorMode = 'black'; 
                    if(dynamicCanvas) dynamicCanvas.style.mixBlendMode = 'multiply';
                }
            }

            let isTransitioning = false;

            videos.forEach((video, domIndex) => {
                video.muted = true;
                video.defaultMuted = true;
                video.playsInline = true;
                video.setAttribute('playsinline', '');
                video.setAttribute('webkit-playsinline', '');
                
                // 크로스페이드(0.8초) 동안 영상이 멈춰보이는 현상을 방지하기 위해 0.8초 전에 다음 영상 시작
                video.addEventListener('timeupdate', () => {
                    if (domIndex === activeVideoIndex && !isTransitioning) {
                        const timeRemaining = video.duration - video.currentTime;
                        // 남은 시간이 0.8초 이하일 때 (영상 데이터가 아직 로드되지 않은 경우 제외)
                        if (timeRemaining <= 0.82 && timeRemaining > 0 && video.duration > 1) {
                            isTransitioning = true;
                            playNextVideo();
                        }
                    }
                });

                video.addEventListener('ended', () => {
                    if (domIndex === activeVideoIndex && !isTransitioning) {
                        isTransitioning = true;
                        playNextVideo();
                    }
                });
            });

            function preloadNextVideo() {
                ensureQueue();
                const nextIndex = videoQueue[0];
                if (nextIndex !== undefined) {
                    const nextVid = videos[nextIndex];
                    nextVid.setAttribute('preload', 'auto');
                    // 현재 재생될 영상과 다음 재생될 영상에만 다운로드를 집중시켜 네트워크 병목 방지
                    nextVid.load();
                }
            }

            function playNextVideo() {
                ensureQueue();
                const nextDomIndex = videoQueue.shift();
                const currentVideo = videos[activeVideoIndex];
                const nextVideo = videos[nextDomIndex];
                activeVideoIndex = nextDomIndex;
                
                nextVideo.currentTime = 0;
                var playPromise = nextVideo.play();
                if (playPromise !== undefined) {
                    playPromise.then(() => {
                        nextVideo.classList.add('active'); 
                        updateHeaderColor(nextVideo); 
                        setTimeout(() => {
                            if (currentVideo) {
                                currentVideo.classList.remove('active');
                                currentVideo.pause(); 
                                currentVideo.currentTime = 0; 
                            }
                            isTransitioning = false; // 크로스페이드 완료 후 상태 초기화
                        }, 800); 
                        
                        preloadNextVideo();
                    }).catch(error => {
                        console.error("Next video play failed:", error);
                        isTransitioning = false;
                        setTimeout(playNextVideo, 500); // 실패 시 다음 영상으로 빠르게 시도
                    });
                } else {
                    isTransitioning = false;
                }
            }

            ensureQueue();
            activeVideoIndex = videoQueue.shift();
            const firstVideo = videos[activeVideoIndex];
            
            // 검은 화면 방지: 첫 비디오를 즉시 active로 만들어 첫 프레임이 보이게 함 (포스터 이미지 미존재시)
            firstVideo.classList.add('active');
            updateHeaderColor(firstVideo);
            if (posterLayer) {
                posterLayer.style.display = 'none'; // 포스터 이미지(poster1.jpg)가 없으므로 화면을 가리지 않게 숨김
            }
            
            firstVideo.setAttribute('autoplay', 'true'); // 모바일 브라우저 자동 재생 유도
            firstVideo.load();
            preloadNextVideo(); // 다음 비디오 미리 로드 시작

            function tryPlayFirstVideo() {
                firstVideo.muted = true;
                var playPromise = firstVideo.play();
                if (playPromise !== undefined) {
                    playPromise.catch((error) => {
                        console.warn("Auto-play prevented, waiting for interaction.");
                        const interactionHandler = () => {
                            firstVideo.play(); 
                            document.removeEventListener('click', interactionHandler);
                            document.removeEventListener('touchstart', interactionHandler);
                        };
                        document.addEventListener('click', interactionHandler);
                        document.addEventListener('touchstart', interactionHandler);
                    });
                }
            }

            if (firstVideo.readyState >= 3) {
                tryPlayFirstVideo();
            } else {
                firstVideo.addEventListener('canplay', tryPlayFirstVideo, { once: true });
                setTimeout(() => { if (firstVideo.paused) tryPlayFirstVideo(); }, 2000);
            }
        });
    </script>
</body>
</html>
