<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CHID</title>
    <meta name="description" content="CHID Industrial Design Portfolio. Seoul based Product Designer. 서울 기반 산업 디자이너 CHID의 포트폴리오.">
    <meta name="keywords" content="CHID, Industrial Design, Product Design, Portfolio, Designer, 칫, 산업디자인, 제품디자인">
    <meta name="author" content="CHID">
    <meta name="robots" content="index, follow">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://chid.kr">
    <meta property="og:title" content="CHID">
    <meta property="og:description" content="Industrial Design Portfolio">
    <meta property="og:image" content="https://chid.kr/img/main/meta_img.webp">
    <link rel="preload" as="image" href="img/main/loop/poster1.jpg">
    <link rel="icon" href="img/main/favicon.webp" type="image/webp">
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.8/dist/web/static/pretendard.css" />
    <script type="application/ld+json">
    {
      "@context": "http://schema.org",
      "@type": "Person",
      "name": "CHID",
      "url": "https://chid.kr",
      "jobTitle": "Industrial Designer",
      "sameAs": [
        "https://www.instagram.com/chid_design/",
        "https://www.behance.net/chiddesign/"
      ]
    }
    </script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Pretendard', 'Inter', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
            background-color: #ffffff;
            color: #1B1B1B;
            height: 100vh;
            height: 100dvh; 
            display: flex;
            flex-direction: column;
            overflow: hidden;
            opacity: 0; 
            transition: opacity 0.5s ease-in-out; 
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            -webkit-tap-highlight-color: transparent;
        }
        body.fade-in { opacity: 1; }
        #video-container {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1; background-color: #1B1B1B; overflow: hidden;
        }

        #poster-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-image: url('img/main/loop/poster1.jpg'); 
            background-size: cover;
            background-position: center;
            z-index: 10;
            transition: opacity 0.8s ease-out;
            opacity: 1;
        }
        #poster-layer.hidden { opacity: 0; pointer-events: none; }
        .bg-video {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            object-fit: cover; 
            opacity: 0;
            z-index: 0;
            visibility: hidden;
            transform: translate3d(0,0,0);
            will-change: opacity;
            transition: opacity 0s, visibility 0s; 
        }
        .bg-video.active { 
            opacity: 1; 
            z-index: 1; 
            visibility: visible;
            transition: opacity 0.8s cubic-bezier(0.16, 1, 0.3, 1), visibility 0s linear 0s;
        }
        header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 20px 40px; 
            width: 100%;
            position: fixed; top: 0; left: 0; z-index: 100;
            background-color: rgba(255, 255, 255, 0.01); 
            backdrop-filter: blur(0px); 
            transition: all 0.5s ease;
            color: #1B1B1B;
            height: 90px;
        }
        header.white-skin { color: #ffffff !important; }
        header.white-skin .logo-img { filter: invert(1); }
        .logo-container { cursor: pointer; z-index: 101; pointer-events: auto; }
        .logo-img { 
            height: 60px; 
            width: auto; display: block; 
            transition: height 0.3s ease, filter 0.5s ease; 
        }
        nav ul { display: flex; list-style: none; gap: 50px; }
        nav ul li { margin-left: 0; }
        nav ul li a {
            text-decoration: none; color: inherit; 
            font-size: clamp(15px, 1.2vw, 18px); 
            font-weight: 400; 
            display: block; 
            padding: 10px 0; 
            letter-spacing: -0.02em;
            opacity: 0.8; 
            transition: opacity 0.3s ease, transform 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            position: relative;
            text-align: center;
            pointer-events: auto;
        }
        nav ul li a::before {
            display: block; content: attr(title); font-weight: 700; height: 0; overflow: hidden; visibility: hidden;
        }
        header.white-skin nav ul li a { text-shadow: 0 0 20px rgba(0,0,0,0.8); }
        nav ul li:hover a { transform: translateY(-0.33em); opacity: 1; }
        nav ul li.active a { font-weight: 700; opacity: 1; }
        nav ul li.active a::after {
            content: ''; display: block; width: 100%; height: 2px; 
            background: currentColor;
            margin-top: 5px; 
            border-radius: 2px;
        }
        main { flex: 1; width: 100%; height: 100%; }
        @media (pointer: fine) {
          * { cursor: none !important; }
        }
        #canvas {
          position: fixed;
          top: 0;
          left: 0;
          width: 100vw;
          height: 100vh;
          z-index: 9999;
          pointer-events: none;
          background: transparent;
        }
        @media (max-width: 768px) {
            header { 
                padding: 15px 20px; 
                flex-direction: column; 
                gap: 15px;
                height: auto;
                background: linear-gradient(to bottom, rgba(0,0,0,0.1) 0%, transparent 100%);
            }
            .logo-img { height: 50px; }
            nav { width: 100%; }
            nav ul { justify-content: center; gap: 25px; width: 100%; }
            nav ul li a { font-size: 16px; font-weight: 500; }
        }
    </style>
</head>
<body>
    <div id="video-container">
        <div id="poster-layer"></div>
    </div>
    <header id="main-header">
        <div class="logo-container" id="main-logo">
            <img src="img/main/Head Logo.svg" alt="Logo" class="logo-img">
        </div>
        <nav>
            <ul>
                <li><a href="about.html" class="nav-link" title="About">About</a></li>
                <li><a href="projects.html" class="nav-link" title="Projects">Projects</a></li>
                <li><a href="contact.html" class="nav-link" title="Contact">Contact</a></li>
            </ul>
        </nav>
    </header>
    <main></main>
    <canvas id="canvas"></canvas>

    <script src="static/js/page_effect.js"></script>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const header = document.getElementById("main-header");
            const posterLayer = document.getElementById("poster-layer");
            
            function fadeAndMove(destinationUrl) {
                if(window.location.href.includes(destinationUrl) && !destinationUrl.includes('index.html')) return;
                document.body.classList.remove('fade-in'); 
                setTimeout(() => { window.location.href = destinationUrl; }, 500);
            }

            const navLinks = document.querySelectorAll('.nav-link');
            navLinks.forEach(link => link.addEventListener('click', function(e) {
                e.preventDefault(); fadeAndMove(this.getAttribute('href')); 
            }));

            const mainLogo = document.getElementById('main-logo');
            if(mainLogo) mainLogo.addEventListener('click', function() { fadeAndMove('index.html'); });

            // ----------------------------------------------------
            // CHID Seamless Playlist Engine v3 (Zero-Thrashing)
            // 브라우저 디코더의 한계를 피하기 위해 6개의 독립된 비디오 요소를 미리 생성하고
            // 재생 시점에만 교차 페이드(Cross-fade)하는 완전 무결성 구조.
            // 기존 2개 플레이어의 src를 교체하는 방식에서 발생하던 프레임 꼬임, 무한 로딩, 블랙아웃 완벽 차단.
            // ----------------------------------------------------
            const videoContainer = document.getElementById('video-container');
            const posterLayer = document.getElementById('poster-layer');
            
            // 기존에 HTML에 하드코딩된 플레이어가 남아있다면 제거 (동적 생성으로 대체)
            const oldA = document.getElementById('playerA');
            const oldB = document.getElementById('playerB');
            if (oldA) oldA.remove();
            if (oldB) oldB.remove();

            const playlistData = [
                { src: "img/main/loop/video 1.mp4", theme: "light" },
                { src: "img/main/loop/video 2.mp4", theme: "dark" },
                { src: "img/main/loop/video 3.mp4", theme: "light" },
                { src: "img/main/loop/video 4.mp4", theme: "light" },
                { src: "img/main/loop/video 5.mp4", theme: "light" },
                { src: "img/main/loop/video 6.mp4", theme: "light" }
            ];

            let playQueue = [];
            let activeIdx = -1; 
            let isTransitioning = false;

            // 1. Create independent video elements for each file
            const videoElements = playlistData.map((data, idx) => {
                const v = document.createElement('video');
                v.className = 'bg-video';
                v.src = data.src;
                v.setAttribute('data-theme', data.theme);
                v.muted = true;
                v.defaultMuted = true;
                v.setAttribute('playsinline', '');
                v.setAttribute('webkit-playsinline', '');
                v.setAttribute('preload', 'auto');
                
                // 탭 백그라운드 전환 등 RAF가 멈췄을 때를 대비한 안전망
                v.addEventListener('ended', () => {
                    if (activeIdx === idx && !isTransitioning) {
                        isTransitioning = true;
                        playNext();
                    }
                });

                videoContainer.appendChild(v);
                return v;
            });

            function shuffleArray(array) {
                for (let i = array.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [array[i], array[j]] = [array[j], array[i]];
                }
            }

            function ensureQueue() {
                if (playQueue.length < 2) {
                    let newPlaylist = [0, 1, 2, 3, 4, 5];
                    shuffleArray(newPlaylist);
                    // 연속 재생 방지
                    if (playQueue.length > 0 && playQueue[playQueue.length - 1] === newPlaylist[0]) {
                        [newPlaylist[0], newPlaylist[1]] = [newPlaylist[1], newPlaylist[0]];
                    }
                    playQueue = playQueue.concat(newPlaylist);
                }
            }

            function updateHeaderColor(theme) {
                const dynamicCanvas = document.getElementById('canvas'); 
                if (theme === "dark") {
                    header.classList.add("white-skin");
                    window.cursorColorMode = 'white'; 
                    if(dynamicCanvas) dynamicCanvas.style.mixBlendMode = 'normal';
                } else {
                    header.classList.remove("white-skin");
                    window.cursorColorMode = 'black'; 
                    if(dynamicCanvas) dynamicCanvas.style.mixBlendMode = 'normal';
                }
            }

            // 2. High-precision Time Checker
            function checkVideoTime() {
                if (!isTransitioning && activeIdx !== -1) {
                    const player = videoElements[activeIdx];
                    if (player && player.duration > 1) {
                        const timeRemaining = player.duration - player.currentTime;
                        // CSS transition(0.8s)에 맞춰 정확히 교차 시작
                        if (timeRemaining <= 0.82) {
                            isTransitioning = true;
                            playNext();
                        }
                    }
                }
                requestAnimationFrame(checkVideoTime);
            }
            requestAnimationFrame(checkVideoTime);

            // 3. Play Next Logic
            function playNext() {
                ensureQueue();
                const nextIdx = playQueue.shift();
                const nextPlayer = videoElements[nextIdx];
                const currentPlayer = activeIdx !== -1 ? videoElements[activeIdx] : null;
                
                // 레이어 뎁스 정리 (DOM 순서 꼬임 방지)
                if (currentPlayer) currentPlayer.style.zIndex = "1";
                nextPlayer.style.zIndex = "2";
                
                // 테마는 영상 재생 즉시 시각적으로 변경
                updateHeaderColor(nextPlayer.getAttribute('data-theme'));
                
                // 무한루프 방지를 위해 활성 인덱스를 먼저 넘김
                activeIdx = nextIdx;
                
                const playPromise = nextPlayer.play();
                
                if (playPromise !== undefined) {
                    playPromise.then(() => {
                        // SUCCESS: 영상 재생이 실제로 시작된 후 페이드인 (블랙아웃 방지)
                        nextPlayer.classList.add('active');
                        
                        setTimeout(() => {
                            if (currentPlayer) {
                                currentPlayer.classList.remove('active');
                                currentPlayer.style.zIndex = "";
                                currentPlayer.pause();
                                currentPlayer.currentTime = 0;
                            }
                            nextPlayer.style.zIndex = "";
                            isTransitioning = false;
                        }, 800); 
                    }).catch(error => {
                        console.error("Video play failed:", error);
                        // FAIL: 실패 시 즉시 화면 정리하고 다음 큐 시도
                        nextPlayer.classList.remove('active');
                        nextPlayer.style.zIndex = "";
                        
                        if (currentPlayer) {
                            currentPlayer.classList.remove('active');
                            currentPlayer.style.zIndex = "";
                            currentPlayer.pause();
                            currentPlayer.currentTime = 0;
                        }
                        isTransitioning = false;
                        
                        setTimeout(() => {
                            isTransitioning = true;
                            playNext();
                        }, 500); 
                    });
                } else {
                    // 구형 브라우저 폴백
                    nextPlayer.classList.add('active');
                    setTimeout(() => {
                        if (currentPlayer) {
                            currentPlayer.classList.remove('active');
                            currentPlayer.style.zIndex = "";
                            currentPlayer.pause();
                            currentPlayer.currentTime = 0;
                        }
                        nextPlayer.style.zIndex = "";
                        isTransitioning = false;
                    }, 800);
                }
            }

            // 4. Initialization
            (function init() {
                ensureQueue();
                activeIdx = playQueue.shift();
                const firstPlayer = videoElements[activeIdx];
                
                updateHeaderColor(firstPlayer.getAttribute('data-theme'));
                firstPlayer.classList.add('active');
                
                if (posterLayer) posterLayer.style.display = 'none'; 
                
                const playPromise = firstPlayer.play();
                if (playPromise !== undefined) {
                    playPromise.catch((error) => {
                        console.warn("Auto-play prevented, waiting for interaction.");
                        const interactionHandler = () => {
                            firstPlayer.play();
                            document.removeEventListener('click', interactionHandler);
                            document.removeEventListener('touchstart', interactionHandler);
                        };
                        document.addEventListener('click', interactionHandler);
                        document.addEventListener('touchstart', interactionHandler);
                    });
                }
            })();
        });
    </script>
</body>
</html>
