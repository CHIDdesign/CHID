<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CHID</title>
    <meta name="description" content="CHID Industrial Design Portfolio. Seoul based Product Designer. 서울 기반 산업 디자이너 CHID의 포트폴리오.">
    <meta name="keywords" content="CHID, Industrial Design, Product Design, Portfolio, Designer, 칫, 산업디자인, 제품디자인">
    <meta name="author" content="CHID">
    <meta name="robots" content="index, follow">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://chid.kr">
    <meta property="og:title" content="CHID">
    <meta property="og:description" content="Industrial Design Portfolio">
    <meta property="og:image" content="https://chid.kr/img/main/meta_img.webp">
    <link rel="preload" as="image" href="img/main/loop/poster1.jpg">
    <link rel="icon" href="img/main/favicon.webp" type="image/webp">
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.8/dist/web/static/pretendard.css" />
    <script type="application/ld+json">
    {
      "@context": "http://schema.org",
      "@type": "Person",
      "name": "CHID",
      "url": "https://chid.kr",
      "jobTitle": "Industrial Designer",
      "sameAs": [
        "https://www.instagram.com/chid_design/",
        "https://www.behance.net/chiddesign/"
      ]
    }
    </script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Pretendard', 'Inter', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
            background-color: #ffffff;
            color: #111111;
            height: 100vh;
            height: 100dvh; 
            display: flex;
            flex-direction: column;
            overflow: hidden;
            opacity: 0; 
            transition: opacity 0.5s ease-in-out; 
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            -webkit-tap-highlight-color: transparent;
        }
        body.fade-in { opacity: 1; }
        #video-container {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1; background-color: #000000; overflow: hidden;
        }
        #video-container::after {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 5;
            pointer-events: none;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.7' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='1'/%3E%3C/svg%3E");
            opacity: 0.04; 
        }
        #poster-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-image: url('img/main/loop/poster1.jpg'); 
            background-size: cover;
            background-position: center;
            z-index: 10;
            transition: opacity 0.8s ease-out;
            opacity: 1;
        }
        #poster-layer.hidden { opacity: 0; pointer-events: none; }
        .bg-video {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            object-fit: cover; 
            opacity: 0;
            z-index: 0;
            transform: translate3d(0,0,0);
            will-change: opacity;
            transition: opacity 0.8s cubic-bezier(0.16, 1, 0.3, 1); 
        }
        .bg-video.active { opacity: 1; z-index: 1; }
        header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 20px 40px; 
            width: 100%;
            position: fixed; top: 0; left: 0; z-index: 100;
            background-color: rgba(255, 255, 255, 0.01); 
            backdrop-filter: blur(0px); 
            transition: all 0.5s ease;
            color: #111111;
            height: 90px;
        }
        header.white-skin { color: #ffffff !important; }
        header.white-skin .logo-img { filter: invert(1); }
        .logo-container { cursor: pointer; z-index: 101; pointer-events: auto; }
        .logo-img { 
            height: 60px; 
            width: auto; display: block; 
            transition: height 0.3s ease, filter 0.5s ease; 
        }
        nav ul { display: flex; list-style: none; gap: 50px; }
        nav ul li { margin-left: 0; }
        nav ul li a {
            text-decoration: none; color: inherit; 
            font-size: clamp(15px, 1.2vw, 18px); 
            font-weight: 400; 
            display: block; 
            padding: 10px 0; 
            letter-spacing: -0.02em;
            opacity: 0.8; 
            transition: opacity 0.3s ease, transform 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            position: relative;
            text-align: center;
            pointer-events: auto;
        }
        nav ul li a::before {
            display: block; content: attr(title); font-weight: 700; height: 0; overflow: hidden; visibility: hidden;
        }
        header.white-skin nav ul li a { text-shadow: 0 0 20px rgba(0,0,0,0.8); }
        nav ul li:hover a { transform: translateY(-0.33em); opacity: 1; }
        nav ul li.active a { font-weight: 700; opacity: 1; }
        nav ul li.active a::after {
            content: ''; display: block; width: 100%; height: 2px; 
            background: currentColor;
            margin-top: 5px; 
            border-radius: 2px;
        }
        main { flex: 1; width: 100%; height: 100%; }
        @media (pointer: fine) {
          * { cursor: none !important; }
        }
        #canvas {
          position: fixed;
          top: 0;
          left: 0;
          width: 100vw;
          height: 100vh;
          z-index: 9999;
          pointer-events: none;
          mix-blend-mode: multiply;
          background: transparent;
        }
        @media (max-width: 768px) {
            header { 
                padding: 15px 20px; 
                flex-direction: column; 
                gap: 15px;
                height: auto;
                background: linear-gradient(to bottom, rgba(0,0,0,0.1) 0%, transparent 100%);
            }
            .logo-img { height: 50px; }
            nav { width: 100%; }
            nav ul { justify-content: center; gap: 25px; width: 100%; }
            nav ul li a { font-size: 16px; font-weight: 500; }
        }
    </style>
</head>
<body>
    <div id="video-container">
        <div id="poster-layer"></div>
        <video class="bg-video" id="v1" playsinline webkit-playsinline muted data-theme="light" preload="auto">
            <source src="img/main/loop/video 1.mp4" type="video/mp4">
        </video>
        <video class="bg-video" id="v2" playsinline webkit-playsinline muted data-theme="dark" preload="auto">
            <source src="img/main/loop/video 2.mp4" type="video/mp4">
        </video>
        <video class="bg-video" id="v3" playsinline webkit-playsinline muted data-theme="light" preload="auto">
            <source src="img/main/loop/video 3.mp4" type="video/mp4">
        </video>
        <video class="bg-video" id="v4" playsinline webkit-playsinline muted data-theme="light" preload="auto">
            <source src="img/main/loop/video 4.mp4" type="video/mp4">
        </video>
        <video class="bg-video" id="v5" playsinline webkit-playsinline muted data-theme="light" preload="auto">
            <source src="img/main/loop/video 5.mp4" type="video/mp4">
        </video>
    </div>
    <header id="main-header">
        <div class="logo-container" id="main-logo">
            <img src="img/main/Head Logo.svg" alt="Logo" class="logo-img">
        </div>
        <nav>
            <ul>
                <li><a href="about.html" class="nav-link" title="About">About</a></li>
                <li><a href="projects.html" class="nav-link" title="Projects">Projects</a></li>
                <li><a href="contact.html" class="nav-link" title="Contact">Contact</a></li>
            </ul>
        </nav>
    </header>
    <main></main>
    <canvas id="canvas"></canvas>
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            setTimeout(() => { document.body.classList.add('fade-in'); }, 50);

            const header = document.getElementById("main-header");
            const posterLayer = document.getElementById("poster-layer");
            
            function fadeAndMove(destinationUrl) {
                if(window.location.href.includes(destinationUrl) && !destinationUrl.includes('index.html')) return;
                document.body.classList.remove('fade-in'); 
                setTimeout(() => { window.location.href = destinationUrl; }, 500);
            }

            const navLinks = document.querySelectorAll('.nav-link');
            navLinks.forEach(link => link.addEventListener('click', function(e) {
                e.preventDefault(); fadeAndMove(this.getAttribute('href')); 
            }));

            const mainLogo = document.getElementById('main-logo');
            if(mainLogo) mainLogo.addEventListener('click', function() { fadeAndMove('index.html'); });

            const canvas = document.getElementById('canvas');
            const ctx = canvas.getContext('2d');
            
            const dotCanvasBlack = document.createElement('canvas');
            dotCanvasBlack.width = 24; dotCanvasBlack.height = 24;
            const ctxB = dotCanvasBlack.getContext('2d');
            ctxB.fillStyle = '#111111';
            ctxB.beginPath(); ctxB.arc(12, 12, 12, 0, Math.PI * 2); ctxB.fill();

            const dotCanvasWhite = document.createElement('canvas');
            dotCanvasWhite.width = 24; dotCanvasWhite.height = 24;
            const ctxW = dotCanvasWhite.getContext('2d');
            ctxW.fillStyle = '#ffffff';
            ctxW.beginPath(); ctxW.arc(12, 12, 12, 0, Math.PI * 2); ctxW.fill();

            let cursorColorMode = 'black'; 

            const PT_TO_PX = 1.333;
            const baseRadius = (((4 * PT_TO_PX) / 2) / 2) * 1.1; 
            const maxRadius = (((9 * PT_TO_PX) / 2) / 2) * 1.1;  
            const gridStep = ((10 * PT_TO_PX) / 2) * 1.1;        
            
            const effectRadius = gridStep * 15; 
            const effectRadiusSq = effectRadius * effectRadius;
            const maxRippleRadius = gridStep * 24; 
            const maxRippleRadiusSq = maxRippleRadius * maxRippleRadius;

            let cols, rows;
            let points = [];
            let activePoints = new Set();
            let mouse = { x: -1000, y: -1000 };
            let ripples = [];

            function initPoints() {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
                cols = Math.ceil(canvas.width / gridStep) + 1;
                rows = Math.ceil(canvas.height / gridStep) + 1;
                points = [];
                activePoints.clear();
                for (let r = 0; r < rows; r++) {
                    for (let c = 0; c < cols; c++) {
                        points.push({
                            c, r, x: c * gridStep, y: r * gridStep,
                            size: baseRadius, colorFactor: 0
                        });
                    }
                }
            }

            window.addEventListener('mousemove', (e) => { mouse.x = e.clientX; mouse.y = e.clientY; });
            window.addEventListener('mouseleave', () => { mouse.x = -1000; mouse.y = -1000; });
            window.addEventListener('mousedown', (e) => { if (e.button === 0) triggerRipple(e.clientX, e.clientY); });
            window.addEventListener('touchstart', (e) => {
                if (e.touches.length > 0) triggerRipple(e.touches[0].clientX, e.touches[0].clientY);
            }, { passive: true });

            function triggerRipple(x, y) {
                ripples.push({ x: x, y: y, radius: 0, strength: 2.5 });
                setTimeout(() => { ripples.push({ x: x, y: y, radius: 0, strength: 1.0 }); }, 80);
            }

            window.addEventListener('resize', initPoints);

            function draw() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);

                let targetC = -100;
                let targetR = -100;

                if (mouse.x >= 0 && mouse.y >= 0) {
                    targetC = Math.round(mouse.x / gridStep);
                    targetR = Math.round(mouse.y / gridStep);
                    const checkRadius = 12; 
                    for (let r = targetR - checkRadius; r <= targetR + checkRadius; r++) {
                        for (let c = targetC - checkRadius; c <= targetC + checkRadius; c++) {
                            if (c >= 0 && c < cols && r >= 0 && r < rows) activePoints.add(r * cols + c);
                        }
                    }
                }

                for (let i = ripples.length - 1; i >= 0; i--) {
                    let r = ripples[i];
                    let progress = Math.min(1, r.radius / maxRippleRadius);
                    let speedFactor = 1 - progress; 
                    r.radius += gridStep * (1.2 * speedFactor + 0.4); 
                    if (r.radius - gridStep * 4 > maxRippleRadius) {
                        ripples.splice(i, 1);
                        continue;
                    }
                    let maxDist = r.radius + gridStep * 2;
                    let cMin = Math.max(0, Math.floor((r.x - maxDist) / gridStep));
                    let cMax = Math.min(cols - 1, Math.ceil((r.x + maxDist) / gridStep));
                    let rMin = Math.max(0, Math.floor((r.y - maxDist) / gridStep));
                    let rMax = Math.min(rows - 1, Math.ceil((r.y + maxDist) / gridStep));
                    for(let col = cMin; col <= cMax; col++) {
                        for(let row = rMin; row <= rMax; row++) activePoints.add(row * cols + col);
                    }
                }

                const dotImg = cursorColorMode === 'white' ? dotCanvasWhite : dotCanvasBlack;

                for (let index of activePoints) {
                    const point = points[index];
                    let mouseTargetSize = baseRadius;
                    let mouseTargetColorFactor = 0;

                    if (point.c === targetC && point.r === targetR) {
                        mouseTargetSize = maxRadius;
                        mouseTargetColorFactor = 1; 
                    } else {
                        const dx = point.x - mouse.x;
                        const dy = point.y - mouse.y;
                        const distSq = dx * dx + dy * dy;
                        if (distSq < effectRadiusSq) {
                            const dist = Math.sqrt(distSq);
                            const factor = 1 - (dist / effectRadius);
                            const f2 = factor * factor;
                            const f4 = f2 * f2;
                            mouseTargetSize = baseRadius + (maxRadius - baseRadius) * (f4 * factor);
                            mouseTargetColorFactor = f4 * f4; 
                        }
                    }

                    let rippleEffect = 0;
                    for (let r of ripples) {
                        const dx = point.x - r.x;
                        const dy = point.y - r.y;
                        if (Math.abs(dx) > maxRippleRadius || Math.abs(dy) > maxRippleRadius) continue; 
                        const distSq = dx * dx + dy * dy;
                        if (distSq <= maxRippleRadiusSq) {
                            const dist = Math.sqrt(distSq);
                            const distanceFade = 1 - (dist / maxRippleRadius);
                            const diff = Math.abs(dist - r.radius);
                            const ring = Math.max(0, 1 - (diff / (gridStep * 3.5)));
                            rippleEffect += (ring * r.strength) * distanceFade;
                        }
                    }

                    let targetSize = Math.max(mouseTargetSize, baseRadius + (maxRadius - baseRadius) * Math.min(1, rippleEffect));
                    let targetColorFactor = Math.max(mouseTargetColorFactor, Math.min(1, rippleEffect * 1.2));

                    const speed = 0.28; 
                    point.size += (targetSize - point.size) * speed;
                    point.colorFactor += (targetColorFactor - point.colorFactor) * speed;

                    if (point.size > baseRadius + 0.01 || point.colorFactor > 0.005) {
                        ctx.globalAlpha = point.colorFactor; 
                        const drawSize = point.size * 2;
                        ctx.drawImage(dotImg, point.x - point.size, point.y - point.size, drawSize, drawSize);
                    } else {
                        point.size = baseRadius;
                        point.colorFactor = 0;
                        activePoints.delete(index);
                    }
                }

                ctx.globalAlpha = 1.0;
                requestAnimationFrame(draw);
            }

            initPoints();
            requestAnimationFrame(draw);

            const videos = Array.from(document.querySelectorAll('.bg-video'));
            let currentPlaylist = [];
            let playlistCursor = 0;
            let activeVideoIndex = -1;

            function shuffleArray(array) {
                for (let i = array.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [array[i], array[j]] = [array[j], array[i]];
                }
            }

            function generatePlaylist() {
                let newPlaylist = videos.map((_, i) => i);
                shuffleArray(newPlaylist);
                if (activeVideoIndex !== -1 && newPlaylist[0] === activeVideoIndex) {
                    if (newPlaylist.length > 1) {
                        [newPlaylist[0], newPlaylist[1]] = [newPlaylist[1], newPlaylist[0]];
                    }
                }
                currentPlaylist = newPlaylist;
                playlistCursor = 0;
            }

            function updateHeaderColor(videoElement) {
                const theme = videoElement.getAttribute("data-theme");
                if (theme === "dark") {
                    header.classList.add("white-skin");
                    cursorColorMode = 'white';
                    canvas.style.mixBlendMode = 'plus-lighter';
                } else {
                    header.classList.remove("white-skin");
                    cursorColorMode = 'black';
                    canvas.style.mixBlendMode = 'multiply';
                }
            }

            videos.forEach((video, domIndex) => {
                video.muted = true;
                video.defaultMuted = true;
                video.playsInline = true;
                video.setAttribute('playsinline', '');
                video.setAttribute('webkit-playsinline', '');
                video.addEventListener('ended', () => {
                    if (domIndex === activeVideoIndex) {
                        playNextVideo();
                    }
                });
            });

            function playNextVideo() {
                playlistCursor++;
                if (playlistCursor >= currentPlaylist.length) generatePlaylist();
                const nextDomIndex = currentPlaylist[playlistCursor];
                const currentVideo = videos[activeVideoIndex];
                const nextVideo = videos[nextDomIndex];
                activeVideoIndex = nextDomIndex;
                nextVideo.currentTime = 0;
                var playPromise = nextVideo.play();
                if (playPromise !== undefined) {
                    playPromise.then(() => {
                        nextVideo.classList.add('active'); 
                        updateHeaderColor(nextVideo); 
                        setTimeout(() => {
                            currentVideo.classList.remove('active');
                            currentVideo.pause(); 
                            currentVideo.currentTime = 0; 
                        }, 800); 
                    }).catch(error => {
                        console.error("Next video play failed:", error);
                    });
                }
            }

            generatePlaylist();
            activeVideoIndex = currentPlaylist[playlistCursor];
            const firstVideo = videos[activeVideoIndex];
            updateHeaderColor(firstVideo);
            firstVideo.load();

            firstVideo.addEventListener('playing', () => {
                firstVideo.classList.add('active');
                setTimeout(() => { posterLayer.classList.add('hidden'); }, 100);
            }, { once: true });

            function tryPlayFirstVideo() {
                firstVideo.muted = true;
                var playPromise = firstVideo.play();
                if (playPromise !== undefined) {
                    playPromise.catch((error) => {
                        const interactionHandler = () => {
                            firstVideo.play(); 
                            document.removeEventListener('click', interactionHandler);
                            document.removeEventListener('touchstart', interactionHandler);
                        };
                        document.addEventListener('click', interactionHandler);
                        document.addEventListener('touchstart', interactionHandler);
                    });
                }
            }

            if (firstVideo.readyState >= 4) {
                tryPlayFirstVideo();
            } else {
                firstVideo.addEventListener('canplaythrough', tryPlayFirstVideo, { once: true });
                setTimeout(() => { if (firstVideo.paused) tryPlayFirstVideo(); }, 2500);
            }
        });
    </script>
</body>
</html>
