<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CHID - Contact</title>
    <meta name="description" content="Contact CHID. Industrial Design portfolio based in Seoul. 서울 기반 산업 디자이너 CHID 이메일 및 연락처.">
    <meta name="keywords" content="CHID, Contact, Industrial Design, Product Design, Portfolio, Designer, 칫, 산업디자인, 제품디자인, 연락처, 의뢰">
    <meta name="author" content="CHID">
    <meta name="robots" content="index, follow">
    <meta property="og:type" content="profile">
    <meta property="og:url" content="https://chid.kr/contact.html">
    <meta property="og:title" content="CHID - Contact">
    <meta property="og:description" content="Industrial Designer CHID | eunjun0505@gmail.com">
    <meta property="og:image" content="img/main/favicon.webp"> 
    <link rel="icon" href="img/main/favicon.webp" type="image/webp">
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.8/dist/web/static/pretendard.css" />
    <script type="application/ld+json">
    {
      "@context": "http://schema.org",
      "@type": "ContactPage",
      "mainEntity": {
        "@type": "Person",
        "name": "CHID",
        "url": "https://chid.kr",
        "email": "eunjun0505@gmail.com",
        "jobTitle": "Industrial Designer",
        "sameAs": [
            "https://www.instagram.com/chid_design/",
            "https://www.behance.net/chiddesign/"
        ]
      }
    }
    </script>
    <link rel="stylesheet" href="static/css/global.css">
    <style>
        :root {
            --header-bg: rgba(255, 255, 255, 0.01);
            --nav-text-color: #1B1B1B;
        }
        body { min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; }
        main { flex: 1; width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 0 20px; }
        .contact-info { 
            text-align: center; display: flex; flex-direction: column; align-items: center;
            animation: slideUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards; opacity: 0; transform: translateY(20px); animation-delay: 0.2s; width: 100%;
        }
        @keyframes slideUp { to { opacity: 1; transform: translateY(0); } }
        .email-link {
            font-size: clamp(24px, 3.5vw, 50px); font-weight: 700; color: #1B1B1B; text-decoration: none;
            margin-bottom: 50px; display: block; transition: color 0.3s ease, transform 0.3s ease;
            letter-spacing: -0.02em; word-break: break-all; cursor: pointer;
        }
        .email-link:hover { color: #555; transform: scale(1.02); }
        .social-links { display: flex; gap: 40px; align-items: center; }
        .social-links a { display: inline-block; width: 36px; height: 42px; transition: transform 0.3s ease; }
        .social-links a:hover { transform: translateY(-5px); }
        .social-icon {
            display: block; width: 100%; height: 100%; background-color: #1B1B1B; opacity: 0.3; 
            transition: opacity 0.3s ease, background 0.3s ease;
            -webkit-mask-size: contain; mask-size: contain; -webkit-mask-position: center; mask-position: center;
            -webkit-mask-repeat: no-repeat; mask-repeat: no-repeat;
        }
        .instagram-icon { -webkit-mask-image: url('img/contact/social/instagram.svg'); mask-image: url('img/contact/social/instagram.svg'); }
        .behance-icon { -webkit-mask-image: url('img/contact/social/Behance.svg'); mask-image: url('img/contact/social/Behance.svg'); }
        .linkedin-icon { -webkit-mask-image: url('img/contact/social/linkedin.svg'); mask-image: url('img/contact/social/linkedin.svg'); }
        .social-links a:hover .social-icon { opacity: 1; }
        .social-links a:hover .instagram-icon { background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%); }
        .social-links a:hover .behance-icon { background: #1769ff; }
        .social-links a:hover .linkedin-icon { background: #0a66c2; }
        .toast {
            position: fixed; bottom: 100px; left: 50%; transform: translateX(-50%) translateY(24px);
            background-color: rgba(0, 0, 0, 0.48); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
            color: #ffffff; font-size: 16px; font-weight: 240; padding: 14px 24px; border-radius: 999px;
            pointer-events: none; opacity: 0; visibility: hidden;
            transition: opacity 0.4s ease, transform 0.4s ease, visibility 0.4s ease; z-index: 1000; white-space: nowrap;
        }
        .toast.show { opacity: 1; visibility: visible; transform: translateX(-50%) translateY(0); }
        
        @media (max-width: 768px) {
            .email-link { font-size: clamp(24px, 6vw, 32px); margin-bottom: 40px; line-height: 1.3; }
            .social-links { gap: 40px; } .social-links a { width: 36px; height: 36px; }
            .toast { font-size: 16px; padding: 14px 32px; bottom: 160px; }
        }
    </style>
</head>
<body>
    <script src="static/js/loader.js"></script>
    <header>
        <div class="logo-container" id="back-to-home" data-href="index.html">
            <img src="img/main/Head Logo.svg" alt="CHID" class="logo-img">
        </div>
        <nav>
            <ul>
                <li><a href="about.html" class="nav-link" title="About">About</a></li>
                <li><a href="projects.html" class="nav-link" title="Projects">Projects</a></li>
                <li class="active"><a href="contact.html" class="nav-link" title="Contact">Contact</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <div class="contact-info">
            <a href="mailto:eunjun0505@gmail.com" class="email-link">eunjun0505@gmail.com</a>
            <div class="social-links">
                <a href="https://www.instagram.com/chid_design/" target="_blank" aria-label="Instagram"><span class="social-icon instagram-icon"></span></a>
                <a href="https://www.behance.net/chiddesign/" target="_blank" aria-label="Behance"><span class="social-icon behance-icon"></span></a>
                <a href="https://www.linkedin.com/in/eunjunchoi/" target="_blank" aria-label="LinkedIn"><span class="social-icon linkedin-icon"></span></a>
            </div>
        </div>
    </main>
    <canvas id="canvas"></canvas>

    <script src="static/js/page_effect.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const emailLink = document.querySelector('.email-link');
            const toast = document.createElement('div');
            toast.className = 'toast'; toast.textContent = 'Copied to Clipboard';
            document.body.appendChild(toast);
            
            let toastTimeout;
            if (emailLink) {
                emailLink.addEventListener('click', function(e) {
                    e.preventDefault(); 
                    const emailAddress = 'eunjun0505@gmail.com';
                    navigator.clipboard.writeText(emailAddress).then(() => {
                        clearTimeout(toastTimeout); toast.classList.add('show');
                        toastTimeout = setTimeout(() => { toast.classList.remove('show'); }, 2500);
                    }).catch(err => {
                        console.error('클립보드 복사 실패:', err); alert('클립보드 복사에 실패했습니다.');
                    });
                });
            }
        });
    </script>
</body>
</html>
