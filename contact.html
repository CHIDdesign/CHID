<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <title>CHID - Contact</title>

    <meta name="description" content="Contact CHID. Industrial Design portfolio based in Seoul. 서울 기반 산업 디자이너 CHID 이메일 및 연락처.">
    <meta name="keywords" content="CHID, Contact, Industrial Design, Product Design, Portfolio, Designer, 칫, 산업디자인, 제품디자인, 연락처, 의뢰">
    <meta name="author" content="CHID">
    <meta name="robots" content="index, follow">

    <meta property="og:type" content="profile">
    <meta property="og:url" content="https://chid.kr/contact.html">
    <meta property="og:title" content="CHID - Contact">
    <meta property="og:description" content="Industrial Designer CHID | eunjun0505@gmail.com">
    <meta property="og:image" content="img/main/favicon.webp"> 

    <link rel="icon" href="img/main/favicon.webp" type="image/webp">
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.8/dist/web/static/pretendard.css" />

    <script type="application/ld+json">
    {
      "@context": "http://schema.org",
      "@type": "ContactPage",
      "mainEntity": {
        "@type": "Person",
        "name": "CHID",
        "url": "https://chid.kr",
        "email": "eunjun0505@gmail.com",
        "jobTitle": "Industrial Designer",
        "sameAs": [
            "https://www.instagram.com/chid_design/",
            "https://www.behance.net/chiddesign/"
        ]
      }
    }
    </script>

    <style>
        /* [기본 스타일] */
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Pretendard', 'Inter', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
            background-color: #ffffff;
            color: #111111;
            
            min-height: 100vh;
            min-height: 100dvh; 
            
            display: flex;
            flex-direction: column;
            opacity: 0;
            transition: opacity 0.5s ease-in-out;
            
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            -webkit-tap-highlight-color: transparent;
        }
        
        body.fade-in { opacity: 1; }

        /* =========================================
           [헤더 스타일]
           ========================================= */
        header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 20px 40px; 
            width: 100%;
            position: fixed; top: 0; left: 0; z-index: 100;
            
            background-color: rgba(255, 255, 255, 0.01); 
            backdrop-filter: blur(0px); 
            transition: all 0.5s ease;
            height: 90px;
        }

        .logo-container { cursor: pointer; }
        
        .logo-img { 
            height: 60px; 
            width: auto; 
            display: block; 
            transition: height 0.3s ease;
        }

        /* [네비게이션 스타일] */
        nav ul { display: flex; list-style: none; gap: 50px; }
        nav ul li { margin-left: 0; }
        
        nav ul li a {
            text-decoration: none; 
            color: #111111;
            font-size: clamp(15px, 1.2vw, 18px); 
            font-weight: 400; 
            display: block; 
            padding: 10px 0; 
            letter-spacing: -0.02em;
            opacity: 0.8; 
            transition: opacity 0.3s ease, transform 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            position: relative;
            text-align: center;
            pointer-events: auto;
        }

        nav ul li a::before {
            display: block; content: attr(title); font-weight: 700; height: 0; overflow: hidden; visibility: hidden;
        }

        nav ul li:hover a { transform: translateY(-0.33em); opacity: 1; }

        nav ul li.active a { font-weight: 700; opacity: 1; }
        
        nav ul li.active a::after {
            content: ''; display: block; width: 100%; height: 2px; 
            background: currentColor;
            margin-top: 5px; 
            border-radius: 2px;
        }

        /* [메인 영역] */
        main { 
            flex: 1; 
            width: 100%; 
            height: 100%;
            display: flex; flex-direction: column; justify-content: center; align-items: center; 
            padding: 0 20px;
        }

        .contact-info { 
            text-align: center; 
            display: flex; 
            flex-direction: column; 
            align-items: center;
            animation: slideUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
            transform: translateY(20px);
            animation-delay: 0.2s;
            width: 100%;
        }

        @keyframes slideUp {
            to { opacity: 1; transform: translateY(0); }
        }
        
        /* 이메일 링크 스타일 */
        .email-link {
            font-size: clamp(24px, 3.5vw, 50px);
            font-weight: 700; 
            color: #111; 
            text-decoration: none;
            margin-bottom: 50px; 
            display: block; 
            transition: color 0.3s ease, transform 0.3s ease;
            letter-spacing: -0.02em;
            word-break: break-all;
            cursor: pointer;
        }
        
        .email-link:hover { 
            color: #555; 
            transform: scale(1.02); 
        }

        /* 소셜 아이콘 스타일 */
        .social-links { display: flex; gap: 40px; align-items: center; }
        
        .social-links a { 
            display: inline-block; 
            width: 36px; 
            height: 42px; 
            transition: transform 0.3s ease; 
        }
        
        .social-links a:hover { transform: translateY(-5px); }

        /* 마스크(Mask)를 활용한 아이콘 공통 스타일 */
        .social-icon {
            display: block;
            width: 100%;
            height: 100%;
            background-color: #111; /* 평상시 기본 색상 */
            opacity: 0.3; /* 평상시 투명도 */
            transition: opacity 0.3s ease, background 0.3s ease;
            
            /* SVG를 스텐실처럼 활용 */
            -webkit-mask-size: contain;
            mask-size: contain;
            -webkit-mask-position: center;
            mask-position: center;
            -webkit-mask-repeat: no-repeat;
            mask-repeat: no-repeat;
        }

        /* 각 아이콘에 SVG 이미지 연결 */
        .instagram-icon {
            -webkit-mask-image: url('img/contact/social/instagram.svg');
            mask-image: url('img/contact/social/instagram.svg');
        }

        .behance-icon {
            -webkit-mask-image: url('img/contact/social/Behance.svg');
            mask-image: url('img/contact/social/Behance.svg');
        }

        .linkedin-icon {
            -webkit-mask-image: url('img/contact/social/linkedin.svg');
            mask-image: url('img/contact/social/linkedin.svg');
        }

        /* --- [마우스 오버(Hover) 효과] --- */
        .social-links a:hover .social-icon {
            opacity: 1; /* 투명도를 100%로 변경 */
        }

        /* 인스타그램: 브랜드 고유 그라데이션 적용 */
        .social-links a:hover .instagram-icon {
            background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
        }

        /* 비핸스: 비핸스 블루 적용 */
        .social-links a:hover .behance-icon {
            background: #1769ff; 
        }

        /* 링크드인: 링크드인 블루 적용 */
        .social-links a:hover .linkedin-icon {
            background: #0a66c2; 
        }

        /* [플로팅 토스트 메시지 스타일 추가] */
        .toast {
            position: fixed;
            bottom: 100px; /* 화면 하단에서의 거리 */
            left: 50%;
            transform: translateX(-50%) translateY(24px);
            
            /* 디자인 요구사항 반영 */
            background-color: rgba(0, 0, 0, 0.48);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px); /* Safari 지원 */
            
            color: #ffffff;
            font-size: 16px;
            font-weight: 240;
            padding: 14px 24px;
            border-radius: 999px; /* 완전한 알약 형태(Pill-shape) */
            
            pointer-events: none; /* 클릭 방해 금지 */
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.4s ease, transform 0.4s ease, visibility 0.4s ease;
            z-index: 1000;
            white-space: nowrap;
        }

        .toast.show {
            opacity: 1;
            visibility: visible;
            transform: translateX(-50%) translateY(0);
        }

        /* [모바일 최적화] */
        @media (max-width: 768px) {
            header { 
                padding: 15px 20px; 
                flex-direction: column; 
                gap: 20px; 
            }
            .logo-img { height: 50px; }
            
            nav { width: 100%; }
            nav ul { justify-content: center; gap: 25px; width: 100%; }
            nav ul li a { font-size: 16px; font-weight: 500; }

            .email-link { 
                font-size: clamp(24px, 6vw, 32px); 
                margin-bottom: 40px; 
                line-height: 1.3;
            }
            
            .social-links { gap: 40px; }
            .social-links a { width: 36px; height: 36px; }

            .toast {
                font-size: 16px;
                padding: 14px 32px;
                bottom: 160px;
            }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-container" id="back-to-home">
            <img src="img/main/Head Logo.svg" alt="CHID" class="logo-img">
        </div>
        <nav>
            <ul>
                <li><a href="about.html" class="nav-link" title="About">About</a></li>
                <li><a href="projects.html" class="nav-link" title="Projects">Projects</a></li>
                <li class="active"><a href="contact.html" class="nav-link" title="Contact">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <div class="contact-info">
            <a href="mailto:eunjun0505@gmail.com" class="email-link">eunjun0505@gmail.com</a>
            <div class="social-links">
                <a href="https://www.instagram.com/chid_design/" target="_blank" aria-label="Instagram">
                    <span class="social-icon instagram-icon"></span>
                </a>
                <a href="https://www.behance.net/chiddesign/" target="_blank" aria-label="Behance">
                    <span class="social-icon behance-icon"></span>
                </a>
                <a href="https://www.linkedin.com/in/eunjunchoi/" target="_blank" aria-label="LinkedIn">
                    <span class="social-icon linkedin-icon"></span>
                </a>
            </div>
        </div>
    </main>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            setTimeout(() => { document.body.classList.add('fade-in'); }, 50);
            
            function fadeAndMove(targetUrl) {
                if(window.location.href.includes(targetUrl)) return;
                document.body.classList.remove('fade-in');
                setTimeout(() => { window.location.href = targetUrl; }, 500);
            }
            
            document.getElementById('back-to-home').addEventListener('click', function() { fadeAndMove('index.html'); });
            
            document.querySelectorAll('.nav-link').forEach(link => {
                link.addEventListener('click', function(e) {
                    e.preventDefault();
                    fadeAndMove(this.getAttribute('href'));
                });
            });

            // --- [클립보드 복사 & 플로팅 토스트 메시지 기능 시작] ---
            const emailLink = document.querySelector('.email-link');
            
            // 토스트 메시지 요소 동적 생성
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.textContent = 'Copied to Clipboard';
            document.body.appendChild(toast);
            
            let toastTimeout;

            if (emailLink) {
                emailLink.addEventListener('click', function(e) {
                    e.preventDefault(); 
                    
                    const emailAddress = 'eunjun0505@gmail.com';
                    
                    navigator.clipboard.writeText(emailAddress).then(() => {
                        // 기존 타이머 초기화 (연속 클릭 시 애니메이션 끊김 방지)
                        clearTimeout(toastTimeout);
                        
                        // 토스트 메시지 표시
                        toast.classList.add('show');
                        
                        // 2.5초 후 메시지 숨김
                        toastTimeout = setTimeout(() => {
                            toast.classList.remove('show');
                        }, 2500);
                    }).catch(err => {
                        console.error('클립보드 복사 실패:', err);
                        alert('클립보드 복사에 실패했습니다.');
                    });
                });
            }
            // --- [클립보드 복사 & 플로팅 토스트 메시지 기능 끝] ---
        });
    </script>
</body>
</html>
