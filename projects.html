<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CHID - Projects</title>
    <link rel="icon" href="img/main/favicon.webp" type="image/webp">
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.8/dist/web/static/pretendard.css" />

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Pretendard', 'Inter', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
            background-color: #ffffff;
            color: #111111;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            opacity: 0;
            transition: opacity 0.5s ease-in-out;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            -webkit-tap-highlight-color: transparent;
        }
        
        body.fade-in { opacity: 1; }

        header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 20px 40px; 
            width: 100%;
            position: fixed; top: 0; left: 0; z-index: 100;
            background-color: rgba(255, 255, 255, 0.95); 
            backdrop-filter: blur(10px);
            transition: transform 0.3s ease-in-out, background-color 0.3s ease;
            height: 90px;
        }

        header.header-hidden {
            transform: translateY(-100%);
        }

        .logo-container { cursor: pointer; }
        .logo-img { height: 60px; width: auto; display: block; transition: height 0.3s ease; }

        nav ul { display: flex; list-style: none; gap: 50px; }
        nav ul li { margin-left: 0; }
        
        nav ul li a {
            text-decoration: none; color: #111111;
            font-size: clamp(15px, 1.2vw, 18px); font-weight: 400; 
            display: block; padding: 10px 0; letter-spacing: -0.02em;
            opacity: 0.8; 
            transition: opacity 0.3s ease, transform 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            position: relative; text-align: center; pointer-events: auto;
        }

        nav ul li a::before {
            display: block; content: attr(title); font-weight: 700; height: 0; overflow: hidden; visibility: hidden;
        }

        nav ul li:hover a { transform: translateY(-0.33em); opacity: 1; }
        nav ul li.active a { font-weight: 700; opacity: 1; }
        nav ul li.active a::after {
            content: ''; display: block; width: 100%; height: 2px; 
            background: currentColor; margin-top: 5px; border-radius: 2px;
        }

        main { 
            flex: 1; width: 100%; 
            padding-top: 140px; padding-bottom: 80px; 
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            padding: 0 40px;
        }

        .project-item { 
            display: block;
            text-decoration: none;
            color: inherit;
            cursor: pointer; 
            -webkit-tap-highlight-color: transparent; 
            /* 기존에 스켈레톤을 숨기고 있던 animation-delay와 fadeUp 애니메이션 제거 */
        }

        .image-wrapper {
            position: relative; width: 100%; aspect-ratio: 3 / 4;
            overflow: hidden; 
            background-color: #f5f5f5; /* 기본 배경색 (스켈레톤 대비용) */
            transform: translateZ(0); 
        }

        /* --- [스켈레톤 UI 스타일] --- */
        .skeleton {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: #eeeeee; 
            z-index: 5;
            transition: opacity 0.5s ease;
        }

        /* 뼈대 위로 지나가는 Shimmer (빛) 애니메이션 */
        .skeleton::after {
            content: "";
            position: absolute;
            top: 0; left: -100%; width: 50%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.7), transparent);
            animation: shimmer 1.2s infinite;
        }

        @keyframes shimmer {
            100% { left: 150%; }
        }

        /* 진짜 이미지: 처음에는 투명도 0으로 숨겨둠 */
        .image-wrapper img {
            width: 100%; height: 100%; object-fit: cover;
            display: block; 
            opacity: 0; 
            transition: opacity 0.6s ease, transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
            transform: scale(1.01); 
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
            will-change: transform, opacity;
            z-index: 1;
        }

        /* 이미지가 로딩 완료되어 .loaded 클래스가 붙었을 때 */
        .image-wrapper.loaded .skeleton {
            opacity: 0;
            pointer-events: none;
        }
        
        .image-wrapper.loaded img {
            opacity: 1; /* 스켈레톤이 사라짐과 동시에 이미지가 페이드인 */
        }

        .project-info-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.7); 
            color: #ffffff;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            text-align: center; opacity: 0; transition: opacity 0.4s ease; padding: 20px;
            z-index: 10;
        }

        .project-item:hover .project-info-overlay { opacity: 1; }
        
        .project-item:hover .image-wrapper img { 
            transform: scale(1.06); 
        }
        
        .info-title { 
            font-size: 18px; font-weight: 700; margin-bottom: 10px; 
            text-transform: uppercase; letter-spacing: 0.05em; 
        }
        .info-desc { 
            font-size: 14px; font-weight: 300; line-height: 1.5; color: #eeeeee; 
        }

        @media (max-width: 1200px) { .gallery-grid { grid-template-columns: repeat(3, 1fr); } }
        @media (max-width: 900px) { .gallery-grid { grid-template-columns: repeat(2, 1fr); } }
        
        @media (max-width: 768px) {
            header { padding: 15px 20px; flex-direction: column; gap: 15px; height: auto; }
            .logo-img { height: 50px; } 
            nav { width: 100%; }
            nav ul { justify-content: center; gap: 25px; width: 100%; }
            nav ul li a { font-size: 16px; font-weight: 500; }

            main { padding-top: 140px; } 
            .gallery-grid { grid-template-columns: 1fr; gap: 30px; padding: 0 20px; }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-container" id="back-to-home">
            <img src="img/main/Head Logo.svg" alt="CHID" class="logo-img">
        </div>
        <nav>
            <ul>
                <li><a href="about.html" class="nav-link" title="About">About</a></li>
                <li class="active"><a href="projects.html" class="nav-link" title="Projects">Projects</a></li>
                <li><a href="contact.html" class="nav-link" title="Contact">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <div class="gallery-grid">

            <a href="projects/kfw.html" class="project-item">
                <div class="image-wrapper">
                    <!-- 1. 뼈대 역할의 스켈레톤 레이어 -->
                    <div class="skeleton"></div>
                    <!-- 2. decoding="async"를 통해 UI 렌더링 블로킹 방지 -->
                    <img src="img/projects/Thumbnail/project_7.webp" alt="KFW 2026" decoding="async">
                    <div class="project-info-overlay">
                        <div class="info-title">KFW 2026</div>
                        <div class="info-desc">Eighth Army<br>Branding<br>2026</div>
                    </div>
                </div>
            </a> 

            <a href="projects/foldiSafe.html" class="project-item">
                <div class="image-wrapper">
                    <div class="skeleton"></div>
                    <img src="img/projects/Thumbnail/project_6.webp" alt="FoldiSafe" decoding="async">
                    <div class="project-info-overlay">
                        <div class="info-title">FoldiSafe</div>
                        <div class="info-desc">COREAMED<br>Suction Liner Bag<br>2025</div>
                    </div>
                </div>
            </a>

            <a href="projects/kunst.html" class="project-item">
                <div class="image-wrapper">
                    <div class="skeleton"></div>
                    <img src="img/projects/Thumbnail/project_5.webp" alt="KUNST" decoding="async">
                    <div class="project-info-overlay">
                        <div class="info-title">KUNST</div>
                        <div class="info-desc">CHID<br>AR Docent Glasses<br>2025</div>
                    </div>
                </div>
            </a>

            <a href="projects/seesaw.html" class="project-item">
                <div class="image-wrapper">
                    <div class="skeleton"></div>
                    <img src="img/projects/Thumbnail/project_4.webp" alt="Seesaw" decoding="async">
                    <div class="project-info-overlay">
                        <div class="info-title">Seesaw</div>
                        <div class="info-desc">Samsung Life Insurance<br>Life-nology Lab<br>2024</div>
                    </div>
                </div>
            </a>

            <a href="projects/aetheris.html" class="project-item">
                <div class="image-wrapper">
                    <div class="skeleton"></div>
                    <img src="img/projects/Thumbnail/project_3.webp" alt="Aetheris" decoding="async">
                    <div class="project-info-overlay">
                        <div class="info-title">Aetheris</div>
                        <div class="info-desc">CHID<br>XR Glasses<br>2024</div>
                    </div>
                </div>
            </a>

            <a href="projects/invasion.html" class="project-item">
                <div class="image-wrapper">
                    <div class="skeleton"></div>
                    <img src="img/projects/Thumbnail/project_2.webp" alt="Invasion" decoding="async">
                    <div class="project-info-overlay">
                        <div class="info-title">Invasion</div>
                        <div class="info-desc">TU Berlin<br>XR Game<br>2024</div>
                    </div>
                </div>
            </a>

            <a href="projects/nezhnost.html" class="project-item">
                <div class="image-wrapper">
                    <div class="skeleton"></div>
                    <img src="img/projects/Thumbnail/project_1.webp" alt="Nezhnost" decoding="async">
                    <div class="project-info-overlay">
                        <div class="info-title">Nezhnost</div>
                        <div class="info-desc">CHID<br>Speaker for ISS<br>2024</div>
                    </div>
                </div>
            </a>

        </div>
    </main>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            // [즉시 실행] 페이지 접속 시 스켈레톤과 UI가 바로 렌더링되도록 트리거
            setTimeout(() => { document.body.classList.add('fade-in'); }, 50);
            
            function fadeAndMove(targetUrl) {
                if(window.location.href.includes(targetUrl)) return;
                document.body.classList.remove('fade-in');
                setTimeout(() => { window.location.href = targetUrl; }, 500);
            }
            
            document.getElementById('back-to-home').addEventListener('click', function() { fadeAndMove('index.html'); });
            
            document.querySelectorAll('.nav-link').forEach(link => {
                link.addEventListener('click', function(e) {
                    e.preventDefault();
                    fadeAndMove(this.getAttribute('href'));
                });
            });

            // --- [이미지 개별 로딩 감지 및 스켈레톤 해제] ---
            const imageWrappers = document.querySelectorAll('.image-wrapper');
            
            imageWrappers.forEach(wrapper => {
                const img = wrapper.querySelector('img');
                if (img) {
                    // 이미지가 성공적으로 불러와졌을 때 실행할 함수
                    const handleLoad = () => {
                        wrapper.classList.add('loaded');
                    };

                    // 브라우저 캐시에 이미 있거나 로딩이 끝난 경우 즉시 전환
                    if (img.complete && img.naturalHeight !== 0) {
                        handleLoad();
                    } else {
                        // 처음 다운로드하는 경우 로드가 끝나면 전환
                        img.addEventListener('load', handleLoad);
                        // 에러가 났을 때 무한 스켈레톤 로딩 방지
                        img.addEventListener('error', handleLoad);
                    }
                }
            });

            // --- [헤더 스크롤 제어] ---
            let lastScrollTop = 0;
            let scrollUpDistance = 0;
            const scrollThreshold = 400;

            const header = document.querySelector('header');
            
            window.addEventListener('scroll', function() {
                let currentScroll = window.pageYOffset || document.documentElement.scrollTop;
                
                if (currentScroll <= 0) {
                    header.classList.remove('header-hidden');
                    lastScrollTop = 0;
                    return; 
                }

                if (currentScroll > lastScrollTop) {
                    header.classList.add('header-hidden');
                    scrollUpDistance = 0;
                } else {
                    scrollUpDistance += (lastScrollTop - currentScroll);
                    if (scrollUpDistance > scrollThreshold) {
                        header.classList.remove('header-hidden');
                        scrollUpDistance = scrollThreshold;
                    }
                }
                lastScrollTop = currentScroll <= 0 ? 0 : currentScroll; 
            }, false);
        });
    </script>
</body>
</html>
